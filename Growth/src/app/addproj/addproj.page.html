<ion-content [fullscreen]="true" class="addproj-content">
  <ion-title>Adicionar Projeto</ion-title>

  <div class="form-container">
    <!-- Upload de Imagem -->
    <div class="image-upload" (click)="selecionarImagem()">
      <div *ngIf="!projeto.imagem" class="placeholder">
        <ion-icon name="image-outline"></ion-icon>
        <p>Clique para adicionar imagem</p>
      </div>
      <div *ngIf="projeto.imagem" class="image-preview">
        <img [src]="projeto.imagem" alt="Preview" />
        <ion-button
          fill="clear"
          class="remove-button"
          (click)="removerImagem(); $event.stopPropagation()">
          <ion-icon slot="icon-only" name="close-circle"></ion-icon>
        </ion-button>
      </div>
    </div>

    <ion-item>
      <ion-label position="stacked">Nome do Projeto:</ion-label>
      <ion-input
        placeholder="Digite o nome do projeto"
        [(ngModel)]="projeto.nome">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Categoria:</ion-label>
      <ion-select
        placeholder="Selecione a categoria"
        [(ngModel)]="projeto.categoria">
        <ion-select-option *ngFor="let cat of categorias" [value]="cat">
          {{ cat }}
        </ion-select-option>
      </ion-select>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Meta:</ion-label>
      <ion-input
        placeholder="Ex: R$ 50.000,00"
        [(ngModel)]="projeto.meta">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Previsão:</ion-label>
      <ion-input
        type="date"
        placeholder="Selecione a data"
        [(ngModel)]="projeto.previsao">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Local:</ion-label>
      <ion-input
        placeholder="Ex: São Paulo, SP"
        [(ngModel)]="projeto.local">
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Descrição:</ion-label>
      <ion-textarea
        rows="4"
        placeholder="Descreva o projeto..."
        [(ngModel)]="projeto.descricao">
      </ion-textarea>
    </ion-item>

    <ion-button
      expand="block"
      class="adicionar-button"
      (click)="adicionar()">
      <ion-icon slot="start" name="add-circle-outline"></ion-icon>
      Adicionar
    </ion-button>
  </div>
</ion-content>
