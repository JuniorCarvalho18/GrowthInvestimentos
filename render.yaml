services:
  # ========================================
  # BACKEND PHP (já funcionando)
  # ========================================
  - type: web
    name: growthinvestimentos-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: growth-db
          property: connectionString

  # ========================================
  # FRONTEND ANGULAR (NOVA CONFIGURAÇÃO)
  # ========================================
  - type: web
    name: growth-frontend
    runtime: static
    buildCommand: cd Growth && npm install && npm run build
    staticPublishPath: ./Growth/www
    routes:
      - type: rewrite
        source: /*
        destination: /index.html